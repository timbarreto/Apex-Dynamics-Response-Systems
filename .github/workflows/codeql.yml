name: CodeQL

# Static analysis security scanning for the JavaScript/TypeScript source.
# Runs on PRs into main and on pushes to main so findings gate merges and
# track the default branch.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Default to read-only; the analyze job elevates to upload security results.
permissions:
  contents: read

# Cancel superseded runs for the same ref to save CI minutes.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      # Required to upload CodeQL results to the Security tab.
      security-events: write
      # Needed by CodeQL to read the repository contents.
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ce28f5bb42b7a9f2c824e633a3f6ee835bab6858 # v3.29.0
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ce28f5bb42b7a9f2c824e633a3f6ee835bab6858 # v3.29.0
        with:
          category: /language:${{ matrix.language }}
